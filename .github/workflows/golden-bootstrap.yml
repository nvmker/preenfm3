# TEMPORARY — bootstrap the gcc golden fixture for the per-compiler
# golden-master scheme. The full render is not byte-stable across compilers (see
# tests/golden/README.md -> Cross-compiler fixtures), so the gcc fixture must be
# generated under ubuntu/gcc in CI, downloaded, and committed. This workflow
# runs PFM3_REGENERATE_GOLDENS=1 under ubuntu/gcc and uploads the generated
# a4_default_sustain_gcc.{bin,xxh,diff.txt} as an artifact.
#
# DELETE THIS FILE once the gcc fixture is committed to tests/golden/.
name: golden-bootstrap (TEMPORARY)

on:
  push:
    branches: [test/golden-master-phase-g0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regen-gcc-fixture:
    name: Regenerate gcc golden fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # No toolchain install: ubuntu-latest ships cmake >= 3.20 and g++ (C++14).
      - name: Configure tests
        run: cmake -B build/test -S tests

      - name: Build tests
        run: cmake --build build/test -j

      # Regen mode WRITES the compiler-specific fixture (does not compare), so
      # this succeeds even though no gcc fixture exists in the tree yet.
      - name: Regenerate gcc golden fixture
        run: >
          PFM3_REGENERATE_GOLDENS=1
          ctest --test-dir build/test
          -R 'GoldenMaster.A4DefaultSustain'
          --output-on-failure

      - name: Show generated hash
        run: cat tests/golden/a4_default_sustain_gcc.xxh

      - uses: actions/upload-artifact@v4
        with:
          name: golden-gcc-fixture
          path: |
            tests/golden/a4_default_sustain_gcc.bin
            tests/golden/a4_default_sustain_gcc.xxh
            tests/golden/a4_default_sustain_gcc.diff.txt
          retention-days: 7
