# Reusable perf gate: Callgrind instruction-count (Ir) regression gate over the
# golden-master render workload. Called by ci.yml (push/PR) in parallel with
# build/test/static-analysis/coverage. Builds tests/bench/perf_main.cpp
# (pfm3_bench — same pfm3_fw_host object library the golden tests lock), runs
# it under valgrind/callgrind with --toggle-collect scoped to
# Synth::buildNewSampleBlock, and FAILS any baseline script whose total Ir
# regresses more than meta.threshold_pct (2%) vs scripts/perf-baseline.json.
# See _bmad-output/planning-artifacts/ci-performance-proposal.md (three-signal
# design; this is signal 1) + ci-performance-implementation-plan.md §2.
#
# ISA-GAP HONESTY (proposal determinism pitfall #3): the measured code is
# x86-64-compiled firmware TUs, NOT Cortex-M7. Absolute Ir says nothing about
# the H7's ~640k-cycle/block deadline. RELATIVE DELTAS and call counts are the
# signal: a >2% host-side delta reliably indicates a real target-side change.
#
# Determinism (why a 2% gate is meaningful): guest Ir = f(binary, input).
# Input = the committed golden scripts. Binary = f(gcc, flags) — pinned by the
# container below (pitfall #1: never ride ubuntu-latest's drifting compiler).
# Valgrind emulates a fixed x86-64 baseline, so runner CPU generation does not
# leak into Ir. Release = -O3 and NO -march=native anywhere (pitfall #2);
# -ffp-contract=off rides in from the object library so the bench measures the
# same code shape the golden tests lock. A container/valgrind/bench-version
# bump hard-fails the gate's meta check — that is the deliberate regen path
# (regenerate-perf-baseline.yml, decision D4).
#
# NOTE: no `concurrency:` block here. As a reusable workflow, we inherit the
# caller's (ci.yml) concurrency group — declaring one that resolves to the
# same group self-deadlocks (see the note in tests.yml).
name: benchmark

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ir-gate:
    name: Perf gate (Callgrind Ir)
    runs-on: ubuntu-latest
    # PIN — the Ir baseline is only valid for this exact compiler. Bump ONLY
    # through a baseline regen (regenerate-perf-baseline.yml) in the same PR.
    container: gcc:13.3.0-bookworm
    # Container jobs default to `sh` (dash); the gate step needs bash's
    # pipefail so the gate's exit code survives the tee into the step summary.
    # bash ships in the gcc (Debian) image.
    defaults:
      run:
        shell: bash
    env:
      PERF_CONTAINER: gcc:13.3.0-bookworm # gate cross-checks meta.container
      # annotate/callgrind reports land here (per-step subdirs keep the
      # bootstrap regen + verify invocations from overwriting each other)
      PERF_GATE_REPORT_DIR: /tmp/perf-reports/gate
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # gcc image ships cmake's build deps but not cmake/valgrind/jq/perl
      # themselves. git IS present (buildpack-deps base) for actions/checkout.
      # perl: callgrind_annotate (the Ir cross-check + top-N report) is a
      # perl script and fails SILENTLY without it.
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake valgrind jq perl

      - name: Configure bench (Release = -O3, no -march=native)
        run: cmake -B build/bench -S tests -DCMAKE_BUILD_TYPE=Release

      - name: Build pfm3_bench
        run: cmake --build build/bench --target pfm3_bench -j"$(nproc)"

      # Template-bootstrap check: a baseline where EVERY entry has
      # ir_total <= 0 is the committed regen TEMPLATE (fresh branch). A MIXED
      # baseline (some real numbers + some zeros) is NOT a template — it falls
      # through to the gate, whose zero-entry hard-fail is the correct loud
      # response (a new script entry must not silently disable gating for the
      # existing ones). The gate hard-fails on zeros by design; here we branch
      # instead of gating: measure a COPY, self-verify it with --threshold=0
      # (exact equality — Callgrind Ir is deterministic), and upload it as an
      # artifact — a human then commits the measured numbers (D4: no
      # auto-commit machinery, no write permissions; the job summary says the
      # gate is INACTIVE).
      - name: Baseline bootstrap check
        id: bootstrap
        run: |
          if jq -e '.ir | to_entries | all(.value.ir_total <= 0)' \
              scripts/perf-baseline.json >/dev/null; then
            echo "template=true" >>"$GITHUB_OUTPUT"
            echo "::warning::perf baseline is a TEMPLATE (zero ir_total)"
            echo "::warning::gate inactive this run — bootstrap measures"
          else
            echo "template=false" >>"$GITHUB_OUTPUT"
          fi

      # Gate table AND failure detail (stderr) land in the step summary
      # (size-gate pattern: 2>&1 before the tee). pipefail keeps the gate's
      # exit code alive through the pipe.
      - name: Perf gate (Callgrind Ir vs baseline)
        if: steps.bootstrap.outputs.template == 'false'
        run: |
          set -o pipefail
          scripts/ci/perf-gate.sh build/bench/pfm3_bench \
            scripts/perf-baseline.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      # Bootstrap path (pure template only): regenerate into a COPY — the
      # committed file is never touched — then self-verify by gating against
      # the copy with --threshold=0: the second measurement must equal the
      # first EXACTLY (0.0000%) — same-container determinism evidence, not a
      # 2%-band pass. The artifact is what a human commits to finish
      # bootstrapping.
      - name: Bootstrap baseline (measure + self-verify, upload artifact)
        if: steps.bootstrap.outputs.template == 'true'
        env:
          PERF_GATE_REPORT_DIR: /tmp/perf-reports/bootstrap-regen
        run: |
          cp scripts/perf-baseline.json /tmp/perf-baseline.bootstrapped.json
          scripts/ci/perf-gate.sh build/bench/pfm3_bench \
            /tmp/perf-baseline.bootstrapped.json --regen
      - name: Bootstrap self-verify (exact 0.0000% deltas)
        if: steps.bootstrap.outputs.template == 'true'
        env:
          PERF_GATE_REPORT_DIR: /tmp/perf-reports/bootstrap-verify
        run: |
          scripts/ci/perf-gate.sh build/bench/pfm3_bench \
            /tmp/perf-baseline.bootstrapped.json --threshold=0
          echo ""
          echo "bootstrap: gate INACTIVE this run."
          echo "Commit the measured baseline to activate it:"
          echo "  gh run download <this run> \
            -n perf-baseline-bootstrap -D /tmp/dl"
          echo "  cp /tmp/dl/perf-baseline.bootstrapped.json \
            scripts/perf-baseline.json"

      - name: Upload bootstrapped baseline
        if: steps.bootstrap.outputs.template == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: perf-baseline-bootstrap
          path: /tmp/perf-baseline.bootstrapped.json
          retention-days: 7

      # A red gate still ships its diagnostics: per-script callgrind .out files
      # + annotate tables (run-id-scoped name, mirrors the build.yml pattern).
      - name: Upload perf reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-annotate-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/perf-reports
          retention-days: 30
