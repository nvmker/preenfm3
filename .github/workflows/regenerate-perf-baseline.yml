# Manually-triggered regeneration of the perf Ir baseline
# (scripts/perf-baseline.json). Run from the Actions tab on the target branch —
# typically your PR branch when shipping an intentional perf change (an
# accepted regression, or a speedup worth locking in); the baseline bump then
# rides in that PR. Builds tests/ in the SAME pinned container benchmark.yml
# gates in (gcc:13.3.0-bookworm), measures each baseline script under
# callgrind, rewrites the JSON, then SELF-VERIFIES by running the gate in
# compare mode — the fresh baseline must PASS at 0.0000% deltas before
# anything is committed.
#
# Why manual (workflow_dispatch): an automatic regen would silently mask real
# perf regressions by overwriting the committed lock. Regen is a deliberate
# act (decision D4) — same contract as regenerate-linux-goldens.yml.
#
# Toolchain bumps (container image, valgrind release): dispatch this on a
# branch after updating the container pins in benchmark.yml + here; the regen
# stamps the new meta.valgrind/meta.container, and the PR carries both the pin
# change and the re-measured numbers.
#
# NOTE: GitHub only registers dispatchable workflows that exist on the DEFAULT
# branch — until this file merges to master, `gh workflow run` 404s on it. The
# initial PR bootstraps its baseline via benchmark.yml's template path instead
# (zero-ir_total baseline → measure + upload artifact → human commits it).
name: regenerate-perf-baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    name: Regenerate perf Ir baseline
    runs-on: ubuntu-latest
    container: gcc:13.3.0-bookworm # PIN — keep in lockstep with benchmark.yml
    # Container jobs default to `sh` (dash); bash is the documented shell for
    # these steps (heredocs, [[ ]]) and ships in the gcc (Debian) image.
    defaults:
      run:
        shell: bash
    env:
      PERF_CONTAINER: gcc:13.3.0-bookworm
      PERF_GATE_REPORT_DIR: /tmp/perf-reports
    steps:
      - name: Checkout (the dispatch branch)
        uses: actions/checkout@v5
        with:
          persist-credentials: true # keep GITHUB_TOKEN for `git push`

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake valgrind jq

      - name: Configure + build bench
        run: |
          cmake -B build/bench -S tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/bench --target pfm3_bench -j"$(nproc)"

      - name: Regenerate baseline (measure + rewrite JSON)
        run: scripts/ci/perf-gate.sh build/bench/pfm3_bench \
          scripts/perf-baseline.json --regen

      - name: Self-verify (gate must PASS at 0.0000% vs the fresh baseline)
        run: scripts/ci/perf-gate.sh build/bench/pfm3_bench \
          scripts/perf-baseline.json

      - name: Upload perf reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-regen-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/perf-reports
          retention-days: 30

      - name: Commit + push the regenerated baseline
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: >-
            41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: >-
            41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          git add scripts/perf-baseline.json
          if git diff --cached --quiet; then
            echo "no baseline changes — already match the measurement"
          else
            git commit -m "ci(perf): regenerate Ir baseline [skip ci]"
            git push
            echo "::notice::baseline committed to ${GITHUB_REF_NAME}"
          fi
