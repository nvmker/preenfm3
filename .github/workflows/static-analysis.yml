# Reusable baseline-gated cppcheck job. Called by ci.yml (push/PR) in PARALLEL
# with build + test (no `needs:`) — a green cross-compile / unit test must not
# mask a new static-analysis finding, and vice-versa. See
# scripts/cppcheck-baseline.txt for the baseline contract and
# scripts/ci/static-analysis.sh for the gate logic.
#
# Scope: firmware/Src + lib/Src. Excludes firmware/Drivers,
# firmware/Middlewares, and bootloader (the code we don't maintain).
# Same cppcheck flags as `make analyze` plus -ibootloader.
#
# Why build cppcheck 2.21.0 from source instead of apt: ubuntu-latest's apt
# cppcheck lags (and drifts when GitHub bumps the image), which would churn the
# checked-in baseline. Source-building 2.21.0 (cached) pins the analyzer version
# so the baseline is stable; the baseline itself was generated by this exact
# binary. The build is ~30s cold, instant warm (cache hit).
name: static-analysis

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# NOTE: no `concurrency:` block here — as a reusable workflow we inherit the
# caller's (ci.yml) concurrency group. Declaring one here that resolves to the
# same group as the caller self-deadlocks and GitHub cancels the job before it
# runs (see tests.yml / the run-#12 note on this repo).

# Bump TOOLCHAIN_VER + the cache key together. Must match build.yml so the two
# jobs can share the toolchain cache when they land on the same runner image.
env:
  TOOLCHAIN_VER: "15.2.rel1"
  CPPCHECK_VER: "2.21.0"

jobs:
  static-analysis:
    name: cppcheck (baseline gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # ---- Arm toolchain (same cache key as build.yml) ------------------
      - name: Cache Arm GNU Toolchain
        id: cache-tc
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/arm-gnu-${{ env.TOOLCHAIN_VER }}
          key: arm-gnu-toolchain-${{ env.TOOLCHAIN_VER }}-x86_64-arm-none-eabi

      - name: Install Arm GNU Toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: |
          set -eux
          dest="$RUNNER_TOOL_CACHE/arm-gnu-$TOOLCHAIN_VER"
          mkdir -p "$dest"
          base="https://developer.arm.com/-/media/Files/downloads/gnu"
          url="$base/$TOOLCHAIN_VER/binrel/"
          url+="arm-gnu-toolchain-$TOOLCHAIN_VER-x86_64-arm-none-eabi.tar.xz"
          curl -L --fail "$url" -o /tmp/tc.tar.xz
          tar -xf /tmp/tc.tar.xz -C "$dest" --strip-components=1
          rm -f /tmp/tc.tar.xz
          "$dest/bin/arm-none-eabi-gcc" --version

      - name: Add toolchain to PATH
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: |
          tc_bin="$RUNNER_TOOL_CACHE/arm-gnu-$TOOLCHAIN_VER/bin"
          echo "$tc_bin" >> "$GITHUB_PATH"
          "$tc_bin/arm-none-eabi-gcc" --version

      # ---- cppcheck 2.21.0 (source-built + cached; version-pinned) ----------
      # cppcheck ships source-only releases (no Linux prebuilt). Build the
      # `cppcheck` CLI target from the release tarball into a cached prefix so
      # warm runs are instant. The baseline was generated by this exact binary.
      - name: Cache cppcheck
        id: cache-cppcheck
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/cppcheck-${{ env.CPPCHECK_VER }}
          key: cppcheck-${{ env.CPPCHECK_VER }}-x86_64

      - name: Build cppcheck
        if: steps.cache-cppcheck.outputs.cache-hit != 'true'
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: |
          set -eux
          dest="$RUNNER_TOOL_CACHE/cppcheck-$CPPCHECK_VER"
          mkdir -p "$dest/bin" /tmp/cc-src
          gh="https://github.com/cppcheck-opensource/cppcheck"
          url="$gh/archive/refs/tags/$CPPCHECK_VER.tar.gz"
          curl -L --fail "$url" -o /tmp/cc.tar.gz
          tar -xzf /tmp/cc.tar.gz -C /tmp/cc-src --strip-components=1
          # Release build; match-compiler off (not needed for a one-shot scan).
          cmake -S /tmp/cc-src -B /tmp/cc-build \
            -DCMAKE_BUILD_TYPE=Release -DUSE_MATCHCOMPILER=OFF
          # Build the CLI target only (skip the Qt GUI + tests).
          cmake --build /tmp/cc-build -j --target cppcheck
          cp /tmp/cc-build/bin/cppcheck "$dest/bin/cppcheck"
          rm -rf /tmp/cc.tar.gz /tmp/cc-src /tmp/cc-build
          "$dest/bin/cppcheck" --version

      - name: Add cppcheck to PATH
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: |
          cc_bin="$RUNNER_TOOL_CACHE/cppcheck-$CPPCHECK_VER/bin"
          echo "$cc_bin" >> "$GITHUB_PATH"
          "$cc_bin/cppcheck" --version

      # ---- Build the cross-compile DB (compile_commands.json) ---------------
      # `make firmware` configures the project (CMake_EXPORT_COMPILE_COMMANDS is
      # ON) and builds the preenfm3 target. The DB lists all TUs at configure
      # time regardless of which target is built, so firmware + lib entries are
      # present; cppcheck reads compile commands, not build artifacts, so the
      # bootloader TUs (unbuilt here) are analyzable too (excluded via -i).
      - name: Build firmware (generates compile_commands.json)
        run: make firmware

      # ---- Run the baseline gate -------------------------------------------
      # Exits non-zero on findings NEW vs scripts/cppcheck-baseline.txt.
      # Outputs (raw + new/resolved diffs) land in /tmp/sa for the upload below.
      - name: cppcheck baseline gate
        run: |
          scripts/ci/static-analysis.sh \
            build/release/compile_commands.json \
            /tmp/sa \
            scripts/cppcheck-baseline.txt

      # Always upload, even on a red gate, so a failing run carries the raw
      # cppcheck output + the new/resolved diffs for offline triage.
      - name: Upload cppcheck output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: preenfm3-cppcheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/sa/analyze-cppcheck.txt
            /tmp/sa/cppcheck-current.txt
            /tmp/sa/cppcheck-new.txt
            /tmp/sa/cppcheck-resolved.txt
          if-no-files-found: warn
          retention-days: 30
